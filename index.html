<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">

        <title>Keyboard</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <script src="js/safari.js"></script>
        <script src="js/window-size.js"></script>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link href="https://cdn.jsdelivr.net/npm/quill@2.0.0/dist/quill.snow.css" rel="stylesheet">
        <link href="css/main.css" rel="stylesheet">
        <link href="css/editor-scrollbar.css" rel="stylesheet">
        <link id="selected-language-stylesheet" rel="stylesheet">

        <script src="https://cdn.jsdelivr.net/npm/quill@2.0.0/dist/quill.js"></script>

        <link rel="modulepreload" href="https://cdn.jsdelivr.net/gh/trentreimer/suggest-engine@v0.7.0/dist/suggest-engine.esm.js">
    </head>
    <body>

        <div id="loading">
            <div class="loading-spinner" aria-hidden="true"></div>
            <span class="translate capitalize" data-translate="loading">Loading</span>
        </div>

        <div id="editor-area">
            <div id="editor"></div>
        </div>

        <div id="tools">
            <div id="toolbars">
                <div id="toolbar">
                    <div id="quill-toolbar">
                        <button class="ql-bold"><i class="fas fa-bold"></i></button>
                        <button class="ql-underline"><i class="fas fa-underline"></i></button>
                        <button class="ql-italic"><i class="fas fa-italic"></i></button>
                        <button class="ql-indent" value="+1"><i class="fas fa-indent"></i></button>
                        <button class="ql-indent" value="-1"><i class="fas fa-outdent"></i></button>
                        <button class="ql-list" value="bullet"><i class="fas fa-list"></i></button>
                        <button class="ql-list" value="ordered"><i class="fas fa-list-ol"></i></button>
                        <!-- <button class="ql-strike"><i class="fas fa-strikethrough"></i></button> -->
                    </div>
                    <div id="custom-toolbar">
                        <!-- <button class="delete-text"><i class="fa fa-eraser"></i> <span class="translate" data-translate="erase all">Erase All</span></button> -->
                        <button class="cut-text translate-aria" data-translate-aria="cut all" aria-label="Cut all"><i class="fas fa-cut"></i></button>
                        <button class="copy-text translate-aria" data-translate-aria="copy all" aria-label="Copy all"><i class="far fa-copy"></i></button>
                        <button class="settings-open translate-aria" data-translate-aria="settings" aria-label="Settings"><i class="fas fa-gear"></i></button>
                    </div>
                </div>
            </div>

            <div id="suggestions-line">
                <div id="suggestions"></div>
            </div>
            <div id="keyboard"></div>
        </div>

        <dialog id="settings">
            <button class="settings-close" aria-label="Close"><i class="fas fa-xmark"></i></button>
            <h2 class="translate capitalize" data-translate="settings">Settings</h2>
            <label class="translate capitalize" for="language-select" data-translate="language">Language</label>
            <select id="language-select"></select>
            <fieldset>
                <legend class="translate capitalize" data-translate="typing behaviour">Typing behaviour</legend>
                <label class="behavior-option">
                    <input type="checkbox" data-behavior="autoSpace">
                    <span class="translate capitalize" data-translate="auto space">Auto Space</span>
                </label>
                <label class="behavior-option">
                    <input type="checkbox" data-behavior="autoUppercase">
                    <span class="translate capitalize" data-translate="auto caps">Auto Caps</span>
                </label>
            </fieldset>
            <label class="behavior-option">
                <input type="checkbox" id="user-words-toggle">
                <span class="translate capitalize" data-translate="include my words in autocompletion">Include my words in autocompletion</span>
            </label>
        </dialog>

        <script src="js/typewriter.js" type="module"></script>
    </body>
</html>
